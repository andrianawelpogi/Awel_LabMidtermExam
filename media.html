<div class="audio-player">
    <h3>Media Showcase</h3>
    <p>Audio introduction detailing portfolio architecture.</p>

    <audio id="myAudio">
        <source src="MaMaaaaa.m4a" type="audio/mp4">
        Your browser does not support audio.
    </audio>

    <button id="playButton" onclick="toggleAudio()">
        ▶ Play Audio
    </button>

    <div class="audio-status" id="audioStatus">
        Audio is ready
    </div>

    <div class="time-display">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <input
        type="range"
        id="progressBar"
        value="0"
        min="0"
        max="100"
        step="0.1"
        aria-label="Audio progress"
    >
</div>

<script>
    const audio = document.getElementById("myAudio");
    const playButton = document.getElementById("playButton");
    const currentTimeDisplay = document.getElementById("currentTime");
    const durationDisplay = document.getElementById("duration");
    const progressBar = document.getElementById("progressBar");
    const audioStatus = document.getElementById("audioStatus");

    function formatTime(seconds) {
        if (!Number.isFinite(seconds)) return "0:00";

        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);

        return minutes + ":" +
            String(remainingSeconds).padStart(2, "0");
    }

    function toggleAudio() {
        if (audio.paused) {
            audio.play().catch(() => {
                audioStatus.textContent =
                    "Unable to play audio. Check the file path.";
            });
        } else {
            audio.pause();
        }
    }

    audio.addEventListener("loadedmetadata", function () {
        durationDisplay.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", function () {
        currentTimeDisplay.textContent = formatTime(audio.currentTime);

        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            progressBar.value =
                (audio.currentTime / audio.duration) * 100;
        }
    });

    audio.addEventListener("play", function () {
        playButton.textContent = "⏸ Pause Audio";
        audioStatus.textContent = "Audio is playing";
    });

    audio.addEventListener("pause", function () {
        playButton.textContent = "▶ Play Audio";

        if (!audio.ended) {
            audioStatus.textContent = "Audio is paused";
        }
    });

    audio.addEventListener("ended", function () {
        playButton.textContent = "▶ Play Audio";
        audioStatus.textContent = "Audio finished";
        progressBar.value = 100;
    });

    audio.addEventListener("waiting", function () {
        audioStatus.textContent = "Loading audio...";
    });

    audio.addEventListener("error", function () {
        audioStatus.textContent =
            "Audio failed to load. Check the filename.";
    });

    progressBar.addEventListener("input", function () {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime =
                (progressBar.value / 100) * audio.duration;
        }
    });
</script>
