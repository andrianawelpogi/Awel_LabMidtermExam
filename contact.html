<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrian's Midterm Portfolio - About</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #9fc2da;
    color: #4e6068;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

nav ul li a {
    transition: all 0.3s ease;
    cursor: pointer;
}

nav ul li a:hover {
    color: #ffffff;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 4px;
}

.image-group a {
    display: inline-block;
    transition: transform 0.3s ease;
}

.image-group a:hover {
    transform: scale(1.08);
}

.circular-img {
    cursor: pointer;
}

header {
    background-color: #634949;
    color: #f5f4f4;
    padding: 15px 20px 0 20px;
    text-align: center;
}

.brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
}

.brand-logo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #d10c0c;
    object-fit: cover;
}

.brand-name {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}

nav {
    background-color: #525050;
    margin: 0 -20px;
    padding: 10px 0 0 0;
}

nav ul {
    list-style: none;
    display: flex;
    justify-content: center;
    gap: 30px;
}

nav a {
    color: #ffffff;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 6px 12px 10px 12px;
    display: inline-block;
    position: relative;
}

nav a.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background-color: #ffffff;
    border-radius: 2px;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.card {
    background-color: #91def5;
    width: 100%;
    max-width: 720px;
    border-radius: 12px;
    padding: 40px 30px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    text-align: center;
}

.card h1 {
    font-size: 1.6rem;
    font-weight: 800;
    color: #38423b;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

.tagline {
    font-size: 0.9rem;
    font-style: italic;
    color: #627267;
    margin-bottom: 25px;
}

.description {
    font-size: 0.85rem;
    line-height: 1.5;
    color: #4a574f;
    max-width: 580px;
    margin: 0 auto 25px auto;
}

.btn {
    display: inline-block;
    background-color: #555555;
    color: #ffffff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: pointer;
}

.btn:hover {
    background-color: #333333;
}

footer {
    background-color: #1a1a1a;
    color: #aaaaaa;
    text-align: center;
    padding: 15px 20px;
    font-size: 0.75rem;
}
.image-group {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 20px 0;
}

.circular-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #d4af37; 
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}
</style>
</head>
<body>

    <header>
        <div class="brand-header">
            <span class="brand-name">Andrian's Midterm Portfolio</span>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="services.html">SERVICES</a></li>
                <li><a href="media.html">media</a></li>
                <li><a href="contact.html" class="active">CONTACT</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <div class="card">
            <h1>Contact Details</h1>
             <div class="contact-container">
             
                <div class="contact-form-section">
                    <h3>Contact Form</h3>
                    <form action="#" method="POST">
                        <div class="form-group">
                            <label for="fullname">Full Name</label>
                            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Inquiry Topic</label>
                            <textarea id="message" name="message" placeholder="Type your inquiry topic here..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
                        </div>
                        <button type="submit" class="btn">SEND MESSAGE</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Agila De Bayani | All Rights Reserved</p>
    </footer>

</body>
</html>
